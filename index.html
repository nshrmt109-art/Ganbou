<style>
  :root{
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --blue: #2a78d6;
    --blue-100: #cde2fb;
    --blue-strong: #184f95;
    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --grid: #2c2c2a;
      --baseline: #383835;
      --blue: #3987e5;
      --blue-100: #16324f;
      --blue-strong: #86b6ef;
      --good: #0ca30c;
      --good-text: #0ca30c;
      --warning: #fab219;
      --serious: #ec835a;
      --critical: #e66767;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height:1.6;
  }
  #app{max-width:900px;margin:0 auto;padding:0 16px 64px;}
  header.top{
    position:sticky;top:0;z-index:20;
    background: var(--page);
    padding:16px 16px 0;
    margin:0 -16px;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:0 16px;}
  .brand h1{font-size:19px;margin:0 0 10px;}
  .today-badge{font-size:13px;color:var(--text-secondary);margin:0 0 10px;}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 16px;}
  nav.tabs button{
    appearance:none;border:none;background:transparent;color:var(--text-secondary);
    padding:10px 12px;font-size:14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;background:var(--surface-1);}
  nav.tabs button:hover{background:var(--surface-1);}
  main{padding-top:20px;}
  .view{display:none;}
  .view.active{display:block;}
  .card{
    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{font-size:16px;margin:0 0 4px;}
  .card .hint{font-size:12.5px;color:var(--text-muted);margin:0 0 14px;}
  label{display:block;font-size:13px;color:var(--text-secondary);margin:14px 0 6px;font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type="text"], input[type="date"], textarea, select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    background:var(--page);color:var(--text-primary);font-size:14px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);
    padding:9px 16px;border-radius:8px;font-size:13.5px;cursor:pointer;font-weight:600;
  }
  .btn:hover{background:var(--blue-100);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:var(--blue-strong);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-secondary);font-weight:500;}
  .btn.ghost:hover{background:var(--border);}
  .btn.danger{color:var(--critical);}
  .btn.small{padding:5px 10px;font-size:12.5px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .quad{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat .num{font-size:22px;font-weight:700;}
  .stat .lbl{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .q-block{margin-bottom:16px;}
  .q-block .q-label{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text-primary);}
  .q-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:var(--blue-100);color:var(--blue-strong);font-size:11.5px;font-weight:700;margin-right:6px;}
  .goal-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .goal-tabs button{
    flex:1;appearance:none;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);
    padding:10px;border-radius:8px;font-size:13.5px;cursor:pointer;font-weight:600;
  }
  .goal-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .goal-list{display:flex;flex-direction:column;gap:10px;}
  .goal-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--page);}
  .goal-card .gtitle{font-size:14.5px;font-weight:700;margin:0 0 2px;}
  .goal-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-bottom:8px;}
  .goal-note{font-size:13px;color:var(--text-secondary);margin:6px 0 8px;white-space:pre-wrap;}
  .status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .status-good{background:rgba(12,163,12,0.14);color:var(--good-text);}
  .status-blue{background:var(--blue-100);color:var(--blue-strong);}
  .status-muted{background:var(--border);color:var(--text-muted);}
  .progress-track{height:8px;border-radius:999px;background:var(--blue-100);overflow:hidden;margin:8px 0 4px;}
  .progress-fill{height:100%;border-radius:999px;background:var(--blue);}
  .progress-pct{font-size:12px;color:var(--text-muted);}
  .empty{color:var(--text-muted);font-size:13.5px;padding:14px 0;text-align:center;}
  .card-actions{display:flex;gap:6px;margin-top:8px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,11,11,0.4);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface-1);border-radius:var(--radius);padding:22px;max-width:440px;width:100%;
    max-height:88vh;overflow-y:auto;border:1px solid var(--border);}
  .modal h3{margin:0 0 4px;font-size:16px;}
  .task-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .task-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--page);}
  .task-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--blue);}
  .task-item .t-text{flex:1;font-size:14px;}
  .task-item.done .t-text{text-decoration:line-through;color:var(--text-muted);}
  .task-goal-tag{font-size:11px;color:var(--blue-strong);background:var(--blue-100);padding:1px 7px;border-radius:999px;display:inline-block;margin-top:3px;}
  .history-entry{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--page);}
  .history-entry .h-date{font-size:12.5px;color:var(--text-muted);font-weight:700;margin-bottom:4px;}
  .chart-wrap{margin-top:6px;}
  .chart-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:76px;border-bottom:1px solid var(--baseline);padding-bottom:2px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;}
  .bar{width:70%;max-width:22px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;}
  .bar.empty-bar{background:var(--grid);}
  .bar-labels{display:flex;gap:6px;margin-top:4px;}
  .bar-labels span{flex:1;text-align:center;font-size:10.5px;color:var(--text-muted);}
  .save-status{font-size:12px;color:var(--text-muted);margin:8px 0 0;}
  .save-status.dirty{color:var(--warning);}
  .data-file{font-size:13px;background:var(--page);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-top:10px;}
  .field-inline{display:flex;align-items:center;gap:8px;}
  .field-inline input[type="range"]{flex:1;accent-color:var(--blue);}
  .field-inline .pct-out{width:40px;text-align:right;font-size:13px;font-weight:700;}
  footer.foot{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:24px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>🎯 願望実現ナビ</h1>
      <div class="today-badge" id="today-badge"></div>
    </div>
    <nav class="tabs">
      <button data-action="nav" data-view="home" class="active">ホーム</button>
      <button data-action="nav" data-view="goals">目標</button>
      <button data-action="nav" data-view="plan">今日の行動計画</button>
      <button data-action="nav" data-view="history">履歴</button>
      <button data-action="nav" data-view="data">データ管理</button>
    </nav>
  </header>

  <main>
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-goals"></section>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-data"></section>
  </main>

  <footer class="foot">データはブラウザ内のみで保持されます。「データ管理」タブから必ず保存してください。</footer>
</div>

<div class="modal-overlay" id="goal-modal-overlay">
  <div class="modal">
    <form id="goal-form">
      <h3 id="goal-modal-title">目標を追加</h3>
      <p class="hint" id="goal-modal-hint"></p>
      <input type="hidden" id="gf-tier">
      <input type="hidden" id="gf-id">
      <label>タイトル<span style="color:var(--critical)">*</span></label>
      <input type="text" id="gf-title" required maxlength="120" placeholder="例: TOEIC800点を取る">
      <div class="row">
        <div>
          <label>達成期限（任意）</label>
          <input type="date" id="gf-deadline">
        </div>
        <div id="gf-parent-wrap" style="display:none;">
          <label id="gf-parent-label">紐づける上位目標</label>
          <select id="gf-parent"></select>
        </div>
      </div>
      <label>進捗</label>
      <div class="field-inline">
        <input type="range" id="gf-progress" min="0" max="100" step="5" value="0">
        <span class="pct-out" id="gf-progress-out">0%</span>
      </div>
      <label>メモ（任意）</label>
      <textarea id="gf-note" placeholder="具体的な計画や気づきなど"></textarea>
      <div class="btn-row">
        <button type="submit" class="btn primary">保存</button>
        <button type="button" class="btn ghost" data-action="modal-close">キャンセル</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- state ---------- */
  function defaultState(){
    return { version:1, philosophy:"", counseling:{}, goals:{long:[],mid:[],short:[]}, plans:{} };
  }
  let state = defaultState();
  let fileHandle = null;
  let dirty = false;
  let lastSavedAt = null;
  let activeView = "home";
  let activeGoalTier = "long";
  let historySelectedDate = null;

  const TIERS = {
    long:  { label:"長期目標", parentTier:null,  placeholder:"例: 3〜5年後に実現したい人生の姿" },
    mid:   { label:"中期目標", parentTier:"long", placeholder:"例: 1年以内に達成したいこと" },
    short: { label:"短期目標", parentTier:"mid",  placeholder:"例: 1〜3ヶ月で達成したいこと" }
  };

  const QUESTIONS = [
    { key:"want",      label:"①私は何を求めているか" },
    { key:"doingNow",  label:"②その為に今何をしているか" },
    { key:"effective", label:"③その行動は私の求めているものを手に入れるのに効果的か" },
    { key:"betterWay", label:"④もっと良い方法を考え出し、実行してみよう" }
  ];

  /* ---------- helpers ---------- */
  function pad(n){ return n.toString().padStart(2,"0"); }
  function toKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayKey(){ return toKey(new Date()); }
  function formatJP(key){
    const p = key.split("-").map(Number);
    const dt = new Date(p[0], p[1]-1, p[2]);
    const w = ["日","月","火","水","木","金","土"][dt.getDay()];
    return p[0]+"年"+p[1]+"月"+p[2]+"日("+w+")";
  }
  function formatShort(key){
    const p = key.split("-").map(Number);
    return p[1]+"/"+p[2];
  }
  function uid(prefix){ return prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function esc(s){
    return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
  function markDirty(){ dirty = true; updateSaveStatus(); if(fileHandle){ saveNow(true); } }

  function allGoals(){ return [].concat(state.goals.long, state.goals.mid, state.goals.short); }
  function goalById(id){ return allGoals().find(g => g.id===id); }
  function tierOf(goal){ return goal.tier; }
  function statusOf(g){
    if(g.progress>=100) return {label:"達成", cls:"status-good", dot:"var(--good)"};
    if(g.progress<=0) return {label:"未着手", cls:"status-muted", dot:"var(--text-muted)"};
    return {label:"進行中", cls:"status-blue", dot:"var(--blue)"};
  }
  function avgProgress(list){
    if(!list.length) return 0;
    return Math.round(list.reduce((s,g)=>s+g.progress,0)/list.length);
  }

  function plansFor(dateKey){ return state.plans[dateKey] || []; }
  function todayPlan(){
    const k = todayKey();
    if(!state.plans[k]) state.plans[k] = [];
    return state.plans[k];
  }
  function completionRate(dateKey){
    const list = state.plans[dateKey];
    if(!list || !list.length) return null;
    const done = list.filter(t=>t.done).length;
    return Math.round(done/list.length*100);
  }

  function migrateState(data){
    const d = defaultState();
    if(data && typeof data === "object"){
      d.philosophy = typeof data.philosophy === "string" ? data.philosophy : "";
      d.counseling = (data.counseling && typeof data.counseling==="object") ? data.counseling : {};
      if(data.goals && typeof data.goals==="object"){
        d.goals.long = Array.isArray(data.goals.long)? data.goals.long : [];
        d.goals.mid = Array.isArray(data.goals.mid)? data.goals.mid : [];
        d.goals.short = Array.isArray(data.goals.short)? data.goals.short : [];
      }
      d.plans = (data.plans && typeof data.plans==="object") ? data.plans : {};
    }
    // ensure tier tag present on goals (for lookups)
    ["long","mid","short"].forEach(t => d.goals[t].forEach(g => g.tier = t));
    return d;
  }

  /* ---------- rendering: HOME ---------- */
  function renderHome(){
    const el = document.getElementById("view-home");
    const k = todayKey();
    const entry = state.counseling[k] || {};
    const rate = completionRate(k);
    const totalGoals = allGoals().length;

    let statsHtml =
      '<div class="quad">'+
        '<div class="stat"><div class="num">'+state.goals.long.length+'</div><div class="lbl">長期目標</div></div>'+
        '<div class="stat"><div class="num">'+state.goals.mid.length+'</div><div class="lbl">中期目標</div></div>'+
        '<div class="stat"><div class="num">'+state.goals.short.length+'</div><div class="lbl">短期目標</div></div>'+
        '<div class="stat"><div class="num">'+(rate===null?"—":rate+"%")+'</div><div class="lbl">今日の行動達成率</div></div>'+
      '</div>';

    let philHtml =
      '<div class="card">'+
        '<h2>🧭 人生理念</h2>'+
        '<p class="hint">あなたが人生で大切にしたい価値観・信条を書き留めておきましょう。迷ったときの判断基準になります。</p>'+
        '<textarea id="hf-philosophy" data-field="philosophy" rows="4" placeholder="例: 誠実に生き、学び続け、周りの人と共に成長する。">'+esc(state.philosophy)+'</textarea>'+
      '</div>';

    let qHtml = QUESTIONS.map(q =>
      '<div class="q-block">'+
        '<div class="q-label">'+esc(q.label)+'</div>'+
        '<textarea data-cf="'+q.key+'" rows="2" placeholder="書いてみましょう...">'+esc(entry[q.key]||"")+'</textarea>'+
      '</div>'
    ).join("");

    let counselHtml =
      '<div class="card">'+
        '<h2>🪞 セルフカウンセリング — '+formatJP(k)+'</h2>'+
        '<p class="hint">毎日、自分に問いかけてみましょう。</p>'+
        '<form id="counseling-form">'+
          qHtml+
          '<div class="btn-row"><button type="submit" class="btn primary">今日の内容を保存</button></div>'+
        '</form>'+
      '</div>';

    const recentKeys = Object.keys(state.counseling).sort().reverse().filter(dk=>dk!==k).slice(0,3);
    let recentHtml = "";
    if(recentKeys.length){
      recentHtml = '<div class="card"><h2>最近の記録</h2>' +
        recentKeys.map(dk => {
          const e = state.counseling[dk];
          const snippet = e.want ? e.want.slice(0,40) : "(未入力)";
          return '<div class="history-entry"><div class="h-date">'+formatJP(dk)+'</div><div>'+esc(snippet)+(e.want && e.want.length>40?"…":"")+'</div></div>';
        }).join("") +
        '<div class="btn-row"><button type="button" class="btn ghost" data-action="nav" data-view="history">履歴をもっと見る →</button></div>'+
      '</div>';
    }

    el.innerHTML = philHtml + counselHtml + statsHtml + recentHtml;
  }

  /* ---------- rendering: GOALS ---------- */
  function renderGoals(){
    const el = document.getElementById("view-goals");
    let tabsHtml = '<div class="goal-tabs">' +
      Object.keys(TIERS).map(t =>
        '<button data-action="goal-tab" data-tier="'+t+'" class="'+(t===activeGoalTier?"active":"")+'">'+TIERS[t].label+' ('+state.goals[t].length+')</button>'
      ).join("") +
      '</div>';

    const tier = activeGoalTier;
    const cfg = TIERS[tier];
    const list = state.goals[tier];

    let listHtml;
    if(!list.length){
      listHtml = '<div class="empty">まだ'+cfg.label+'がありません。追加してみましょう。</div>';
    } else {
      listHtml = '<div class="goal-list">' + list.map(g => renderGoalCard(g, tier)).join("") + '</div>';
    }

    el.innerHTML =
      '<div class="card">'+
        tabsHtml+
        '<p class="hint">'+cfg.placeholder+'</p>'+
        listHtml+
        '<div class="btn-row"><button type="button" class="btn primary" data-action="goal-add-open" data-tier="'+tier+'">＋ '+cfg.label+'を追加</button></div>'+
      '</div>';
  }

  function renderGoalCard(g, tier){
    const st = statusOf(g);
    let parentLabel = "";
    if(TIERS[tier].parentTier && g.parentId){
      const p = goalById(g.parentId);
      if(p) parentLabel = '<span>↳ 上位目標: '+esc(p.title)+'</span>';
    }
    let deadlineLabel = g.deadline ? '<span>期限: '+esc(g.deadline)+'</span>' : "";
    return (
      '<div class="goal-card">'+
        '<div class="gtitle">'+esc(g.title)+'</div>'+
        '<div class="goal-meta">'+
          '<span class="status-badge '+st.cls+'"><span style="width:6px;height:6px;border-radius:50%;background:'+st.dot+';display:inline-block;"></span>'+st.label+'</span>'+
          deadlineLabel+parentLabel+
        '</div>'+
        '<div class="progress-track"><div class="progress-fill" style="width:'+g.progress+'%"></div></div>'+
        '<div class="progress-pct">進捗 '+g.progress+'%</div>'+
        (g.note ? '<div class="goal-note">'+nl2br(g.note)+'</div>' : "")+
        '<div class="card-actions">'+
          '<button class="btn small" data-action="goal-edit-open" data-tier="'+tier+'" data-id="'+g.id+'">編集</button>'+
          '<button class="btn small danger" data-action="goal-delete" data-tier="'+tier+'" data-id="'+g.id+'">削除</button>'+
        '</div>'+
      '</div>'
    );
  }

  /* ---------- goal modal ---------- */
  function openGoalModal(tier, editingId){
    const overlay = document.getElementById("goal-modal-overlay");
    const cfg = TIERS[tier];
    document.getElementById("gf-tier").value = tier;
    document.getElementById("gf-id").value = editingId || "";
    document.getElementById("goal-modal-title").textContent = (editingId ? cfg.label+"を編集" : cfg.label+"を追加");
    document.getElementById("goal-modal-hint").textContent = cfg.placeholder;

    const parentWrap = document.getElementById("gf-parent-wrap");
    const parentSel = document.getElementById("gf-parent");
    if(cfg.parentTier){
      parentWrap.style.display = "";
      document.getElementById("gf-parent-label").textContent = TIERS[cfg.parentTier].label+"に紐づける（任意）";
      const options = state.goals[cfg.parentTier];
      parentSel.innerHTML = '<option value="">— なし —</option>' + options.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("");
    } else {
      parentWrap.style.display = "none";
      parentSel.innerHTML = "";
    }

    let g = editingId ? goalById(editingId) : null;
    document.getElementById("gf-title").value = g ? g.title : "";
    document.getElementById("gf-deadline").value = g ? (g.deadline||"") : "";
    document.getElementById("gf-progress").value = g ? g.progress : 0;
    document.getElementById("gf-progress-out").textContent = (g? g.progress:0)+"%";
    document.getElementById("gf-note").value = g ? (g.note||"") : "";
    if(cfg.parentTier) parentSel.value = g && g.parentId ? g.parentId : "";

    overlay.classList.add("open");
    document.getElementById("gf-title").focus();
  }
  function closeGoalModal(){
    document.getElementById("goal-modal-overlay").classList.remove("open");
  }

  function submitGoalForm(e){
    e.preventDefault();
    const tier = document.getElementById("gf-tier").value;
    const editingId = document.getElementById("gf-id").value;
    const title = document.getElementById("gf-title").value.trim();
    if(!title) return;
    const deadline = document.getElementById("gf-deadline").value || "";
    const progress = Number(document.getElementById("gf-progress").value)||0;
    const note = document.getElementById("gf-note").value.trim();
    const parentSel = document.getElementById("gf-parent");
    const parentId = TIERS[tier].parentTier ? (parentSel.value || null) : null;

    if(editingId){
      const g = goalById(editingId);
      if(g){ g.title=title; g.deadline=deadline; g.progress=progress; g.note=note; g.parentId=parentId; }
    } else {
      state.goals[tier].push({ id:uid("g"), tier, title, deadline, progress, note, parentId, createdAt: Date.now() });
    }
    closeGoalModal();
    markDirty();
    renderAll();
  }

  /* ---------- rendering: PLAN ---------- */
  function renderPlan(){
    const el = document.getElementById("view-plan");
    const k = todayKey();
    const list = plansFor(k);
    const rate = completionRate(k);

    const shortGoals = state.goals.short;
    const goalOptions = '<option value="">（目標と紐づけない）</option>' + shortGoals.map(g=>'<option value="'+g.id+'">'+esc(g.title)+'</option>').join("");

    let tasksHtml;
    if(!list.length){
      tasksHtml = '<div class="empty">今日の行動計画はまだありません。追加しましょう。</div>';
    } else {
      tasksHtml = '<div class="task-list">' + list.map(t=>{
        const g = t.goalId ? goalById(t.goalId) : null;
        return (
          '<div class="task-item '+(t.done?"done":"")+'">'+
            '<input type="checkbox" data-action="task-toggle" data-id="'+t.id+'" '+(t.done?"checked":"")+'>'+
            '<div style="flex:1;">'+
              '<div class="t-text">'+esc(t.text)+'</div>'+
              (g ? '<span class="task-goal-tag">🎯 '+esc(g.title)+'</span>' : "")+
            '</div>'+
            '<button class="btn small ghost" data-action="task-delete" data-id="'+t.id+'">削除</button>'+
          '</div>'
        );
      }).join("") + '</div>';
    }

    el.innerHTML =
      '<div class="card">'+
        '<h2>✅ 今日の行動計画 — '+formatJP(k)+'</h2>'+
        (rate!==null ? '<div class="progress-track"><div class="progress-fill" style="width:'+rate+'%"></div></div><div class="progress-pct">達成率 '+rate+'% （'+list.filter(t=>t.done).length+'/'+list.length+'）</div>' : '<p class="hint">今日のタスクを追加すると達成率が表示されます。</p>')+
        tasksHtml+
        '<form id="task-form" style="margin-top:14px;">'+
          '<label>新しいタスク</label>'+
          '<input type="text" id="tf-text" required maxlength="140" placeholder="例: 参考書を10ページ進める">'+
          '<div class="row" style="margin-top:8px;">'+
            '<select id="tf-goal">'+goalOptions+'</select>'+
            '<button type="submit" class="btn primary" style="flex:0 0 auto;">＋ 追加</button>'+
          '</div>'+
        '</form>'+
        '<div class="btn-row"><button type="button" class="btn ghost" data-action="task-carry">↺ 前回の未完了タスクを引き継ぐ</button></div>'+
      '</div>';
  }

  function addTask(text, goalId){
    todayPlan().push({ id:uid("t"), text, done:false, goalId: goalId||null, createdAt: Date.now() });
  }
  function toggleTask(id){
    const t = todayPlan().find(x=>x.id===id);
    if(t) t.done = !t.done;
  }
  function deleteTask(id){
    const k = todayKey();
    state.plans[k] = plansFor(k).filter(x=>x.id!==id);
  }
  function carryOverYesterday(){
    const k = todayKey();
    const keys = Object.keys(state.plans).filter(dk => dk < k).sort().reverse();
    if(!keys.length){ alert("引き継げる過去のタスクがありません。"); return; }
    const srcKey = keys[0];
    const incomplete = plansFor(srcKey).filter(t=>!t.done);
    if(!incomplete.length){ alert(formatJP(srcKey)+"の未完了タスクはありませんでした。"); return; }
    const existingTexts = new Set(todayPlan().map(t=>t.text));
    let added = 0;
    incomplete.forEach(t=>{
      if(!existingTexts.has(t.text)){ addTask(t.text, t.goalId); added++; }
    });
    markDirty();
    renderAll();
    alert(added+"件のタスクを引き継ぎました。");
  }

  /* ---------- rendering: HISTORY ---------- */
  function renderHistory(){
    const el = document.getElementById("view-history");
    const days = [];
    const base = new Date();
    for(let i=13;i>=0;i--){
      const d = new Date(base);
      d.setDate(d.getDate()-i);
      days.push(toKey(d));
    }
    const maxBar = 60;
    let barsHtml = days.map(dk=>{
      const r = completionRate(dk);
      const h = r===null ? 2 : Math.max(2, Math.round(maxBar*r/100));
      const title = r===null ? formatJP(dk)+": 記録なし" : formatJP(dk)+": "+r+"%";
      return '<div class="bar-col" data-action="history-select" data-date="'+dk+'" title="'+esc(title)+'">'+
        '<div class="bar '+(r===null?"empty-bar":"")+'" style="height:'+h+'px;"></div>'+
      '</div>';
    }).join("");
    let labelsHtml = days.map(dk=>'<span>'+formatShort(dk)+'</span>').join("");

    const selKey = historySelectedDate || todayKey();
    const selEntry = state.counseling[selKey];
    const selTasks = plansFor(selKey);
    const selRate = completionRate(selKey);

    let detailHtml = '<div class="card"><h2>詳細: '+formatJP(selKey)+'</h2>';
    if(selEntry){
      detailHtml += QUESTIONS.map(q => selEntry[q.key] ? ('<div class="q-block"><div class="q-label">'+esc(q.label)+'</div><div style="font-size:13.5px;color:var(--text-secondary);white-space:pre-wrap;">'+esc(selEntry[q.key])+'</div></div>') : "").join("");
    } else {
      detailHtml += '<p class="hint">この日のセルフカウンセリングの記録はありません。</p>';
    }
    if(selTasks.length){
      detailHtml += '<label>行動計画（達成率 '+selRate+'%）</label><div class="task-list">' +
        selTasks.map(t=>'<div class="task-item '+(t.done?"done":"")+'"><span>'+(t.done?"☑":"☐")+'</span><div class="t-text">'+esc(t.text)+'</div></div>').join("") +
        '</div>';
    } else {
      detailHtml += '<p class="hint">この日の行動計画の記録はありません。</p>';
    }
    detailHtml += '</div>';

    el.innerHTML =
      '<div class="card">'+
        '<div class="chart-title">直近14日間の行動計画 達成率</div>'+
        '<div class="chart-wrap"><div class="bars">'+barsHtml+'</div><div class="bar-labels">'+labelsHtml+'</div></div>'+
        '<p class="hint" style="margin-top:10px;">棒をクリックするとその日の詳細を表示します。</p>'+
      '</div>'+
      detailHtml;
  }

  /* ---------- rendering: DATA ---------- */
  function renderData(){
    const el = document.getElementById("view-data");
    const supportsFS = !!window.showOpenFilePicker;
    const fileInfo = fileHandle ? ('連携中のファイル: <strong>'+esc(fileHandle.name)+'</strong>') : "ファイル未連携（自動保存されません）";
    const savedInfo = lastSavedAt ? ('最終保存: '+lastSavedAt.toLocaleString("ja-JP")) : "まだ保存されていません";

    el.innerHTML =
      '<div class="card">'+
        '<h2>💾 データの保存・読み込み</h2>'+
        '<p class="hint">このツールはブラウザの一時領域にのみデータを保持し、閉じると消えます。作業内容は下のいずれかの方法で必ず保存してください。</p>'+
        (supportsFS ?
          ('<p style="font-size:13.5px;"><strong>方法A（推奨）: ファイルに連携する</strong><br>1つのJSONファイルと連携すると、変更するたびに自動保存されます。</p>'+
           '<div class="btn-row">'+
             '<button class="btn primary" data-action="link-new">新しいファイルを作成して連携</button>'+
             '<button class="btn" data-action="link-open">既存のファイルを開いて連携</button>'+
             '<button class="btn" data-action="save-now">今すぐ保存</button>'+
           '</div>'+
           '<div class="data-file">'+fileInfo+'</div>')
          : '<p class="hint">お使いの環境ではファイル連携に対応していません。下のエクスポート／インポートをご利用ください。</p>'
        )+
        '<p style="font-size:13.5px;margin-top:16px;"><strong>方法B: ファイルを手動で書き出す・読み込む</strong><br>作業のたびにJSONファイルとして保存し、次回開くときに読み込んでください。</p>'+
        '<div class="btn-row">'+
          '<button class="btn" data-action="export-json">エクスポート（JSONダウンロード）</button>'+
          '<label class="btn" style="display:inline-block;">'+
            'インポート（JSON読み込み）<input type="file" id="import-input" accept="application/json" style="display:none;">'+
          '</label>'+
        '</div>'+
        '<p class="save-status '+(dirty?"dirty":"")+'">'+(dirty?"⚠ 未保存の変更があります　":"")+savedInfo+'</p>'+
      '</div>'+
      '<div class="card">'+
        '<h2>⚠ すべてのデータを消去</h2>'+
        '<p class="hint">入力したすべての内容を削除して初期状態に戻します。元に戻せません。</p>'+
        '<div class="btn-row"><button class="btn danger" data-action="reset-all">すべて消去する</button></div>'+
      '</div>';
  }

  function updateSaveStatus(){
    const bar = document.querySelector(".save-status");
    if(!bar) return;
    const savedInfo = lastSavedAt ? ("最終保存: "+lastSavedAt.toLocaleString("ja-JP")) : "まだ保存されていません";
    bar.className = "save-status "+(dirty?"dirty":"");
    bar.innerHTML = (dirty?"⚠ 未保存の変更があります　":"")+savedInfo;
  }

  /* ---------- persistence ---------- */
  async function writeToHandle(handle, data){
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
  }

  async function linkNewFile(){
    if(!window.showSaveFilePicker){ alert("この環境ではファイル連携に対応していません。"); return; }
    try{
      fileHandle = await window.showSaveFilePicker({
        suggestedName: "goal-data.json",
        types: [{ description:"JSON", accept:{ "application/json":[".json"] } }]
      });
      await writeToHandle(fileHandle, state);
      dirty = false; lastSavedAt = new Date();
      renderData();
    }catch(err){ if(err.name!=="AbortError") alert("ファイル作成でエラー: "+err.message); }
  }

  async function linkOpenFile(){
    if(!window.showOpenFilePicker){ alert("この環境ではファイル連携に対応していません。"); return; }
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{ description:"JSON", accept:{ "application/json":[".json"] } }]
      });
      fileHandle = handle;
      const file = await fileHandle.getFile();
      const text = await file.text();
      state = migrateState(JSON.parse(text));
      dirty = false; lastSavedAt = new Date();
      renderAll();
    }catch(err){ if(err.name!=="AbortError") alert("読み込みでエラー: "+err.message); }
  }

  async function saveNow(silent){
    if(fileHandle){
      try{
        const opts = { mode:"readwrite" };
        let perm = await fileHandle.queryPermission(opts);
        if(perm !== "granted"){ perm = await fileHandle.requestPermission(opts); }
        if(perm !== "granted"){ if(!silent) alert("保存の権限が許可されませんでした。"); return; }
        await writeToHandle(fileHandle, state);
        dirty = false; lastSavedAt = new Date();
        updateSaveStatus();
        const info = document.querySelector(".data-file");
        if(info) info.innerHTML = "連携中のファイル: <strong>"+esc(fileHandle.name)+"</strong>";
      }catch(err){ if(!silent) alert("保存に失敗しました: "+err.message); }
    } else {
      exportJSON();
    }
  }

  function exportJSON(){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "goal-data-"+todayKey()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    dirty = false; lastSavedAt = new Date();
    updateSaveStatus();
  }

  function importJSONFile(file){
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const data = JSON.parse(reader.result);
        state = migrateState(data);
        dirty = false; lastSavedAt = new Date();
        renderAll();
        alert("データを読み込みました。");
      }catch(err){ alert("読み込みに失敗しました。ファイル形式をご確認ください。"); }
    };
    reader.readAsText(file);
  }

  function resetAll(){
    if(!confirm("本当にすべてのデータを消去しますか？この操作は元に戻せません。")) return;
    state = defaultState();
    fileHandle = null;
    dirty = false; lastSavedAt = null;
    renderAll();
  }

  /* ---------- nav / render all ---------- */
  function setView(v){
    activeView = v;
    document.querySelectorAll(".view").forEach(el => el.classList.toggle("active", el.id === "view-"+v));
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
    renderActive();
  }
  function renderActive(){
    if(activeView==="home") renderHome();
    else if(activeView==="goals") renderGoals();
    else if(activeView==="plan") renderPlan();
    else if(activeView==="history") renderHistory();
    else if(activeView==="data") renderData();
  }
  function renderAll(){
    document.getElementById("today-badge").textContent = "今日: "+formatJP(todayKey());
    renderActive();
  }

  /* ---------- event delegation ---------- */
  document.getElementById("app").addEventListener("click", function(e){
    const t = e.target.closest("[data-action]");
    if(!t) return;
    const action = t.dataset.action;
    if(action==="nav"){ setView(t.dataset.view); }
    else if(action==="goal-tab"){ activeGoalTier = t.dataset.tier; renderGoals(); }
    else if(action==="goal-add-open"){ openGoalModal(t.dataset.tier, null); }
    else if(action==="goal-edit-open"){ openGoalModal(t.dataset.tier, t.dataset.id); }
    else if(action==="goal-delete"){
      if(confirm("この目標を削除しますか？")){
        const tier = t.dataset.tier, id = t.dataset.id;
        state.goals[tier] = state.goals[tier].filter(g=>g.id!==id);
        markDirty(); renderAll();
      }
    }
    else if(action==="task-delete"){ deleteTask(t.dataset.id); markDirty(); renderAll(); }
    else if(action==="task-carry"){ carryOverYesterday(); }
    else if(action==="history-select"){ historySelectedDate = t.dataset.date; renderHistory(); }
    else if(action==="link-new"){ linkNewFile(); }
    else if(action==="link-open"){ linkOpenFile(); }
    else if(action==="save-now"){ saveNow(false); }
    else if(action==="export-json"){ exportJSON(); }
    else if(action==="reset-all"){ resetAll(); }
  });

  document.getElementById("app").addEventListener("change", function(e){
    if(e.target.id === "import-input" && e.target.files[0]){
      importJSONFile(e.target.files[0]);
      e.target.value = "";
    }
    if(e.target.dataset && e.target.dataset.action === "task-toggle"){
      toggleTask(e.target.dataset.id);
      markDirty(); renderPlan();
    }
    if(e.target.dataset && e.target.field === "philosophy"){
      // handled below via blur listener too
    }
  });

  document.getElementById("app").addEventListener("blur", function(e){
    if(e.target.id === "hf-philosophy"){
      state.philosophy = e.target.value;
      markDirty();
    }
  }, true);

  document.getElementById("app").addEventListener("submit", function(e){
    if(e.target.id === "counseling-form"){
      e.preventDefault();
      const k = todayKey();
      if(!state.counseling[k]) state.counseling[k] = {};
      QUESTIONS.forEach(q=>{
        const ta = e.target.querySelector('[data-cf="'+q.key+'"]');
        state.counseling[k][q.key] = ta ? ta.value : "";
      });
      state.counseling[k].updatedAt = Date.now();
      markDirty();
      alert("今日のセルフカウンセリングを保存しました。");
      renderAll();
    }
    if(e.target.id === "task-form"){
      e.preventDefault();
      const text = document.getElementById("tf-text").value.trim();
      if(!text) return;
      const goalId = document.getElementById("tf-goal").value || null;
      addTask(text, goalId);
      markDirty();
      renderPlan();
    }
  });

  document.getElementById("goal-form").addEventListener("submit", submitGoalForm);
  document.getElementById("goal-modal-overlay").addEventListener("click", function(e){
    if(e.target.id === "goal-modal-overlay") closeGoalModal();
  });
  document.getElementById("goal-modal-overlay").addEventListener("click", function(e){
    if(e.target.closest('[data-action="modal-close"]')) closeGoalModal();
  });
  document.getElementById("gf-progress").addEventListener("input", function(e){
    document.getElementById("gf-progress-out").textContent = e.target.value+"%";
  });

  window.addEventListener("beforeunload", function(e){
    if(dirty){ e.preventDefault(); e.returnValue = ""; }
  });

  /* ---------- init ---------- */
  renderAll();
})();
</script>
</body>
</html>
